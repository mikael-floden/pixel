name: Composer score

# The music domain's score (music/) — generated by the games-audio agent +
# ELEVENLABS_API_KEY as the music domain (maintainer 2026-07-19, "free hands").
# On-demand only: run it after editing a brief in music/pipeline/score/generate.py.
# Generates lossless, picks the best of N candidates by measured quality,
# masters to a shared loudness, measures loop points, and commits the ogg/m4a
# delivery copies + tracks.json. The pushed files deploy with the next client
# build (bundled by Vite via import.meta.glob).

on:
  workflow_dispatch:
    inputs:
      track:
        description: "title | night | adventure | town | cave | home | battle | new (the 5 context beds) | all"
        default: "new"
      seconds:
        description: "Length in seconds (blank = the track's default)"
        default: ""

permissions:
  contents: write
  actions: write # self-trigger the deploy after committing

concurrency:
  group: composer-theme
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # 5 beds x up to 3 candidates of ~100 s each is a lot of model time; the
    # old 20 min was sized for a single title-theme roll.
    timeout-minutes: 90
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests numpy scipy imageio-ffmpeg

      - name: Self-test the DSP (loudness meter, loop finder)
        run: python music/pipeline/score/test_master.py

      - name: Compose the track(s)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python music/pipeline/score/generate.py "${{ github.event.inputs.track || 'title' }}" "${{ github.event.inputs.seconds }}"

      - name: Commit + push
        if: always()
        id: push
        run: |
          git config user.name "pixel-composer-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add music/
          git diff --cached --quiet && { echo "nothing generated"; exit 0; }
          git commit -m "composer: generate score beds (own generation rights)"
          ok=0
          for i in 1 2 3 4; do
            if git push origin main; then ok=1; break; fi
            git pull --rebase origin main
          done
          [ "$ok" = 1 ] || git push origin main
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      # Default GITHUB_TOKEN pushes don't fire the deploy workflow — dispatch it.
      - name: Trigger deploy
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/nangijala-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "deploy dispatched"
