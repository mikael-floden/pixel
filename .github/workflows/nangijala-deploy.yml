name: nangijala deploy

# Build the single Nangijala image (client + art + Colyseus WS) and deploy it
# to Cloud Run. Keyless auth via Workload Identity Federation — no stored
# secrets. One-time setup: games2/deploy/gcp-bootstrap.sh, then set the repo
# Variables it prints. See games2/deploy/DEPLOY.md.
#
# Speed design (same quality, faster):
# - `test` runs typecheck + the FULL unit/sim suite IN PARALLEL with the image
#   build; `deploy` needs both. The gate costs ~0 wall time (build is longer)
#   and CI now enforces what agents already run locally.
# - BuildKit layer cache (GHA cache backend): npm ci and untouched art-domain
#   layers are reused, not rebuilt — and unchanged layers are already in the
#   registry, so a code-only deploy uploads megabytes, not ~500MB. (Classic
#   `docker build` re-churned every layer digest via file mtimes.)
# - The cache is IMPORTED before the build and EXPORTED after the rollout, in
#   a `type=cacheonly` step at the end of the job: the export is for the next
#   deploy and measured 95-132 s, all of it after the image was pushed.
# - Dockerfile layers are ordered by change frequency (deps → art per domain →
#   game source last); .dockerignore is an allowlist.

on:
  push:
    branches: [main]
    # Game code AND every art domain the game bakes into its image auto-deploy
    # (maintainer 2026-07-17: "if graphics or map data that effects the game
    # changed, it should be baked into a deploy and released automatically").
    # The art loops push frequently; every push is its own run (CONCURRENCY,
    # below), the rollout guard keeps the runs from rolling production
    # backwards, and BuildKit's layer cache keeps art-only rebuilds cheap.
    # Manifests (characters.json / worlds.json) regenerate inside the image
    # build, so art-only deploys are complete.
    paths:
      - "games2/**"
      - "characters2/**"
      # Tiles 3.0. Without this line the domain is in the image (Dockerfile COPYs it,
      # .dockerignore allows it) but nothing ever REBUILDS the image when it changes,
      # so the wiki's World section serves whatever tiles happened to be baked in by
      # someone else's deploy. Third allowlist in the chain that has to name a new
      # domain explicitly, after .dockerignore and the Dockerfile — added by the tiles
      # agent 2026-08-17 with the maintainer's go-ahead.
      - "tiles/**"
      - "maps2/**"
      - "scenery/**"
      - "sounds/**"
      - "music/**"
      - "monsters/**"
      - "items/**"
      - "lore/**"
      # Wiki SITE changes deploy; data.json refreshes must NOT restart prod
      # (prod rebuilds data.json inside the image anyway). live/** is the
      # runtime channel — NEVER a deploy trigger (live-notify.yml handles it).
      - "wiki/**"
      - "!wiki/site/data.json"
      - ".github/workflows/nangijala-deploy.yml"
      # The image's allowlist itself: adding or removing a domain there changes what
      # ships, and previously changed it silently until some other domain's push
      # happened to trigger a build.
      - ".dockerignore"
  workflow_dispatch: {}       # manual: force a roll without any commit

# CONCURRENCY — NO SHARED GROUP, because a shared one can DEADLOCK THE WHOLE
# PIPELINE (maintainer 2026-08-07: "I want no deadlock").
#
# What happened: `group: nangijala-deploy` was one literal shared by every run
# of every branch and event, with cancel-in-progress. On 2026-08-06 run #1118
# ended up wedged in `queued` — and unkillable: the API answers
# `409 Cannot cancel a workflow re-run that has not yet queued`. From then on
# every deploy's `build-deploy` job was created, never assigned a runner
# (`runner_id: 0`) and cancelled at a flat 15 minutes, while the `resolve` and
# `test` jobs in the SAME runs got runners within seconds. main sat 3 commits
# ahead of production for ~18 hours with a green test gate the whole time.
#
# ROOT CAUSE OF THE ZOMBIE, stated plainly because the lesson is operational:
# it was created by calling the "re-run workflow" API on a run that was still
# QUEUED rather than completed. NEVER re-run a run that has not finished —
# dispatch a new one instead. That is also the documented recovery below.
#
# THE FIX is to stop runs sharing a gate at all:
#   • a PUSH groups by its own commit, so a wedged run can only ever hold the
#     gate for the commit it belongs to and can never block a later one;
#   • a DISPATCH groups by run id, so the manual recovery path is unblockable
#     by construction — which matters because it is the only lever left when
#     something is stuck.
# cancel-in-progress still does its real job: superseding a RE-push or re-run
# of the same commit.
#
# WHAT THIS COSTS, honestly: rapid art pushes no longer collapse into the
# newest run, so N pushes are N deploys. That is affordable here precisely
# because of the design already documented above — BuildKit's GHA layer cache
# means an art-only rebuild reuses every untouched layer and uploads megabytes
# rather than ~500MB, and a Cloud Run rollout is idempotent. A few extra
# rollouts is a much smaller problem than a pipeline that can stop for a day.
concurrency:
  group: nangijala-deploy-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.sha }}
  cancel-in-progress: true

jobs:
  # WHAT ARE WE DEPLOYING? Resolved ONCE, here, and used by both jobs below.
  #
  # `github.sha` is the commit the run was CREATED with, which for a dispatched
  # deploy is whatever main pointed at when the dispatch was accepted — not what
  # main holds when the build actually starts. A generator that pushes art and
  # then dispatches this workflow loses that race: composer-foley pushed 20 new
  # sounds at 06:12:13 on 2026-08-06 and dispatched one second later, and the
  # deploy still built the previous tip. The sounds were on GitHub and 404'd in
  # the game, and the deploy went GREEN — which is why generated art only
  # "sometimes" showed up.
  #
  # Resolving here rather than in each job keeps the gate honest: if `test` and
  # `build-deploy` each resolved main themselves they could land on different
  # commits and the suite would be testing something other than what ships.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # a two-step API lookup; anything longer is a hang
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      ts: ${{ steps.rev.outputs.ts }}
      client_only: ${{ steps.lane.outputs.client_only }}
    steps:
      - id: rev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          json=$(gh api "repos/${{ github.repository }}/commits/main")
          sha=$(printf '%s' "$json" | jq -r .sha)
          # THE COMMIT'S OWN TIMESTAMP, as the ORDER of the two lanes. The fast
          # lane can publish a client the image does not contain, so the server
          # needs to know which of the two is NEWER — otherwise a container
          # rollout is silently overridden by a generation published from an
          # EARLIER commit, which is a rollback nobody asked for and a
          # mismatched client/server pair. A commit count would need the full
          # history (this checkout is depth 1 by design); the committer date
          # comes free with the lookup above and is monotonic for pushes to
          # main, which is the only way this repo writes history (no
          # force-pushes — root CLAUDE.md).
          ts=$(date -u -d "$(printf '%s' "$json" | jq -r .commit.committer.date)" +%s)
          echo "deploying main @ $sha (committed $ts, run was created with ${{ github.sha }})"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ts=$ts" >> "$GITHUB_OUTPUT"

      # IS THIS PUSH ONE THE FAST LANE ALREADY CARRIES? A client-only push is
      # served by a published generation in ~66 s (measured 2026-09-19 on
      # 7931ca59c3), and building the image for it too costs five minutes to
      # deliver code that is ALREADY LIVE. It also makes the two lanes tie on
      # commit_ts, and law 6 gives a tie to the image, so the container ends up
      # re-serving byte-identical client code it waited five minutes to build.
      #
      # AN ART PUSH DELIBERATELY STILL BUILDS AN IMAGE, and this filter is why
      # — do not "fix" it by adding the art lane's paths. art-publish.yml
      # serves new art on the running server in ~45 s, but a generation's art is
      # the delta against the IMAGE, so it grows for as long as the image stands
      # still. The container refreshing every few minutes is what keeps that
      # delta near p50 (21 files / 0.73 MB) instead of a day's worth of art, and
      # it is what makes law 6 undo a bad art generation automatically, with
      # nobody doing anything. It costs no wall-clock a person experiences: the
      # art is already live. See games2/docs/fast-lane.md, "the art lane".
      #
      # THE ANSWER DEFAULTS TO "DEPLOY", and every uncertainty resolves that
      # way: no push range (workflow_dispatch, a new branch), an API that will
      # not answer, an empty file list, a truncated comparison. Skipping a
      # deploy that was needed strands art or a server change with no signal
      # that it happened, which is far worse than a wasted build — so the skip
      # has to be PROVEN, never assumed. `test` deliberately still runs: it is
      # the only thing that runs the 806-test suite on a client push, and it is
      # parallel to the build so it costs no wall time.
      - id: lane
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          deploy() { echo "client_only=false" >> "$GITHUB_OUTPUT"; echo "DEPLOYING: $1"; exit 0; }
          [ "${{ github.event_name }}" = "push" ] || deploy "not a push (${{ github.event_name }}) — nothing to compare"
          case "$BEFORE" in ""|0000000000000000000000000000000000000000) deploy "no before-sha on this push";; esac
          cmp=$(gh api "repos/${{ github.repository }}/compare/$BEFORE...${{ github.sha }}") || deploy "the compare API would not answer"
          # A comparison GitHub truncated is one we cannot reason about.
          trunc=$(printf '%s' "$cmp" | jq -r '(.files | length) as $n | (.total_commits // 0) as $c | if $n >= 300 then "yes" else "no" end')
          [ "$trunc" = "no" ] || deploy "the file list is at the API's 300-file ceiling"
          files=$(printf '%s' "$cmp" | jq -r '.files[].filename')
          [ -n "$files" ] && [ "$files" != "null" ] || deploy "the compare returned no files"
          echo "changed:"; echo "$files" | sed 's/^/  /'
          # The SAME set fast-publish.yml admits, and nothing else.
          outside=$(echo "$files" | grep -vE '^games2/client/(src/|index\.html$)' | grep -vE '^(coordination/|live/)' || true)
          if [ -n "$outside" ]; then
            echo "these need the image:"; echo "$outside" | sed 's/^/  /'
            deploy "$(echo "$outside" | wc -l) path(s) the fast lane cannot carry"
          fi
          echo "client_only=true" >> "$GITHUB_OUTPUT"
          echo "SKIPPING the image: every changed path rides the fast lane."
          { echo "### No image for this push"; echo "Every changed path is carried by the fast lane (\`fast-publish.yml\`), which serves it in ~66 s."; echo "The image is unchanged and remains the floor; the suite still ran."; } >> "$GITHUB_STEP_SUMMARY"

  # Quality gate — runs in parallel with the image build, so it adds ~no wall
  # time. Sparse checkout: only what typecheck + npm test actually read
  # (games2, characters2 for the manifest, live for the tuning resolver's
  # baked layer — without it every monster fights as the builtin poring and
  # the combat tests fail on exactly the stats they assert).
  # KNOWN GAP: /maps2/worlds3/ (the_game, the only world) is NOT here, so every
  # world-reading test skips — add it (18 MB) the moment the_game's parity
  # fixtures are green, because until then it would stop every deploy
  # (games2/CLAUDE.md "THE DEPLOY GATE AND CI MUST SEE THE SAME WORLD").
  test:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20 # measured ~1 min; a 20x ceiling only catches a hang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The SAME commit build-deploy ships — see the `resolve` job.
          ref: ${{ needs.resolve.outputs.sha }}
          sparse-checkout: |
            /games2/
            /characters2/
            /live/
            # ...and the wiki parse gate below reads its own script and the
            # file it checks. A step that reads a path this list does not
            # fetch fails MODULE_NOT_FOUND and takes every domain's deploy
            # with it — three commits in a row on 2026-09-07, none of them
            # the wiki's own.
            /wiki/tools/
            /wiki/site/wiki.js
            # ...and the lane-filter guard reads the three workflow files whose
            # path filters it EXECUTES. Without this it fails ENOENT.
            /.github/workflows/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games2/package-lock.json
      - run: npm ci
        working-directory: games2
      - run: npm run typecheck
        working-directory: games2
      # THE WIKI'S SCRIPT MUST PARSE. wiki/site/wiki.js is loaded by a plain
      # <script src>, so ONE module keyword in it is a SyntaxError that stops
      # the whole file and the wiki never boots — production hung on "GATHERING
      # THE WORLD…" for every visitor on 2026-09-06, from an `export` added in
      # passing by another domain's refactor, and the deploy that shipped it was
      # green. NOT `node --check`: Node 22 sees the export, decides the file is
      # a module and passes it. The check compiles it under classic-script
      # rules, which is what the <script> tag already committed to.
      # THE LANE FILTERS MUST BEHAVE AS THE LANES REQUIRE, and this runs HERE
      # rather than in art-publish.yml because that workflow's `paths:` never
      # matches an edit to a workflow file — the one change that can break it.
      # `test` runs on every push, unconditionally.
      #
      # It EXECUTES each filter against probe paths. The guard it replaces
      # compared the filter as a STRING and was vacuous: the canonical widening
      # spells the art set `^(characters2|tiles|…)/`, which contains no
      # `characters2/` substring. Proven to go red on exactly that edit.
      - name: The lane filters (an art push must still build an image)
        working-directory: games2
        run: node scripts/check-deploy-filter.mjs

      - name: wiki.js parses as a classic script
        run: node wiki/tools/check-script.mjs
      - run: npm test
        working-directory: games2

  # Build, push AND roll out in ONE job — a separate deploy job costs a whole
  # extra runner spinup + auth (~45s measured). The test gate stays real: the
  # deploy step polls the parallel `test` job and aborts on failure (tests
  # normally finish before the image push does, so the wait is ~zero).
  build-deploy:
    needs: resolve
    # See resolve's `lane` step. Only a PROVEN client-only push is skipped; the
    # verdict defaults to 'false' on every uncertainty, and a skipped deploy is
    # always recoverable by running this workflow by hand (workflow_dispatch).
    if: needs.resolve.outputs.client_only != 'true'
    runs-on: ubuntu-latest
    # The image build is the long pole (layer-cache cold builds run several
    # minutes). This is a hang-catcher, not a budget — raise it rather than
    # let a real build be killed. NOTE it cannot help a job that never STARTS:
    # timeout-minutes only runs once a runner is assigned, which is exactly
    # why the concurrency fix above is the actual answer to the deadlock.
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write          # required for Workload Identity Federation
      actions: read            # poll the sibling test job's status
    steps:
      # NO sparse-checkout here, deliberately. This used to list 12 of the 13
      # top-level domains as a sparse-checkout, which sounds cheaper but is
      # not: passing
      # `sparse-checkout` makes actions/checkout use a BLOBLESS PARTIAL CLONE
      # (--filter=blob:none), so every file it does materialise costs an extra
      # lazy fetch round-trip. Selecting ~83% of the tree that way was pure
      # overhead — measured 48s mean (21-99s), the largest and most variable
      # step in this job, versus 6.5s for the `test` job's genuinely narrow
      # 3-path sparse checkout. The one thing the list actually excluded was
      # the retired games/ tree, and that is now deleted from the repo
      # (9a73cc25c), so there is nothing left to exclude.
      # The tip of main as resolved ONCE by the `resolve` job — NOT github.sha,
      # which is the commit this run was created with and can predate a
      # generator's push by seconds. Everything below tags, stamps and deploys
      # with the same value, so the image name always names its own contents.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # THE WIKI'S RELEASE NOTES NEED GIT, AND THE IMAGE HAS NONE (wiki agent,
      # 2026-09-13). The Release Notes section lists the last 50 commits; the
      # registry that carries them is rebuilt INSIDE the image, where the
      # .dockerignore allowlist has kept .git out since the beginning. So the
      # list is written into the build context here — the only place that has
      # both the history and the commit being shipped — and the deployed page
      # then names the 50 commits ending at the build the player is running.
      #
      # DEEPENED BLOBLESS, AND THAT IS THE WHOLE COST. The checkout above is
      # depth 1 on purpose (a full checkout of this repo is the job's longest
      # step), and `git log -50` in a depth-1 clone returns ONE commit. A
      # blobless deepen fetches the missing commits and trees and no file
      # content at all: measured on this repo, 60 commits of history is 0.1 MB
      # over what the tip already carries (6.4 vs 6.3 MB of objects). Never
      # widen this to a plain deepen — that one pulls every blob of every
      # commit, which on an art repo is hundreds of megabytes.
      #
      # It cannot fail the deploy: a list of commit messages is not worth a
      # rollout, and the committed wiki/release_notes.json is the fallback the
      # image build reads if this step writes nothing.
      # A deepen by REFSPEC and a deepen of what the clone already tracks are
      # both spelled differently by different checkout versions; neither is
      # allowed to pull blobs, and neither is allowed to fail the job. If both
      # miss, the builder refuses to replace 50 commits with the 1 a shallow
      # clone reports (wiki/lib/releases.mjs) and the committed list ships.
      - name: The wiki's release list (the image has no .git)
        continue-on-error: true
        run: |
          git fetch --deepen=60 --filter=blob:none --no-tags origin "${{ needs.resolve.outputs.sha }}" \
            || git fetch --deepen=60 --filter=blob:none --no-tags origin \
            || echo "::warning::could not deepen — the committed release list will ship"
          echo "history depth now: $(git rev-list --count HEAD)"
          node wiki/lib/releases.mjs

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # NB: no `setup-gcloud` step — the Google Cloud SDK is preinstalled on
      # ubuntu-latest, and the auth step above exports the credentials the CLI
      # picks up on its own. The action was costing 19s per deploy to install a
      # CLI that was already there. If a future runner image drops the SDK this
      # job fails at `gcloud auth configure-docker` with "gcloud: not found" —
      # prod keeps serving the previous revision, and the fix is to put
      # `- uses: google-github-actions/setup-gcloud@v2` back here.
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # THE CACHE EXPORT IS NOT ON THE CRITICAL PATH — it is written AFTER the
      # rollout, by the last step of this job.
      #
      # Measured on this repo (runs 4185/4186/4188/4190, three independent
      # reads of the BuildKit logs): `cache-to: type=gha,mode=max` spent
      # 95-132 s exporting layers to the GitHub cache, and every second of it
      # ran after the image was already in Artifact Registry. It buys the NEXT
      # deploy its warm layers and does nothing at all for this one, yet the
      # rollout — and the maintainer, who tests in production from a phone —
      # waited for it: 5 m 40 s of "Build & push" of which ~2 minutes was that
      # export, against a 26 s rollout.
      #
      # So this step builds and pushes with the cache it can IMPORT, the
      # rollout happens, and the export runs last from the builder's own local
      # cache (nothing is rebuilt: every layer is still there, so the second
      # invocation resolves the whole graph from cache and only writes it out).
      # THE IMAGE IS UNAFFECTED: what deploys is the digest pushed here, and a
      # build cache is content-addressed — BuildKit keys every layer on its
      # parent chain, so a reused layer cannot predate its own inputs, and the
      # asset index (built in a layer whose parent is the curated art) can
      # never describe bytes older than itself.
      - name: Build & push image (layer-cached)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: games2/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}:${{ needs.resolve.outputs.sha }}
            ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}:latest
          build-args: |
            GIT_SHA=${{ needs.resolve.outputs.sha }}
            GIT_COMMIT_TS=${{ needs.resolve.outputs.ts }}
          # THE LAYER CACHE LIVES IN ARTIFACT REGISTRY, NOT IN THE GHA CACHE.
          # The GHA cache is 10 GB per repo and LRU, and this repo writes ~12 GB
          # of new layer bytes a day (35.9 art-changing runs x 235.6 MB curated,
          # plus the raw domain layers), so it turns over completely every
          # 20-29 h: any art state older than about a day is simply gone.
          # Measured on run 4244, a ONE-FILE code push, that eviction — not
          # churn — cost 78 s. `COPY characters2/` missed at 0.5% churn and,
          # being the chain's first miss, dragged nine COPYs (45.1 s) and the
          # 33.2 s shipset RUN behind it. By content, 92.7% of code-only builds
          # should be a pure curate hit.
          # Artifact Registry has no size cap, lives in the repo this job
          # already pushes two tags to, and is covered by the same keyless
          # Workload Identity Federation — no new secret, role, variable or
          # setup step, which is what makes it a phone-safe change.
          # SAFE ONLY BECAUSE EVERY PER-PUSH PRODUCER SITS BELOW
          # `ENV VITE_GIT_SHA=$GIT_SHA` in games2/Dockerfile (ship-tiles3,
          # build-asset-index, wiki/build.mjs, build:client) and therefore
          # re-runs by construction. A cache that never evicts would otherwise
          # serve one of them from an older commit — a stale wiki registry or
          # asset index, which is the silent-stale class this repo has been bitten
          # by twice. If one ever moves above that line it needs its own
          # `ARG GIT_SHA`.
          # type=gha stays as a SECOND source so the first build after this is
          # still warm; it can go once the registry cache has been written once.
          cache-from: |
            type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}-buildcache:main
            type=gha

      - name: Wait for the test gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            st=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | select(.name=="test") | .conclusion // "pending"')
            if [ "$st" = "success" ]; then echo "test gate green"; exit 0; fi
            case "$st" in failure|cancelled|timed_out) echo "test job: $st — NOT deploying"; exit 1;; esac
            sleep 5
          done
          echo "timed out waiting for the test job" && exit 1

      # WOULD THIS ROLLOUT MOVE PRODUCTION BACKWARDS? Asked of PRODUCTION, never
      # of main's tip.
      #
      # The concurrency group above is per-commit ON PURPOSE (a shared gate
      # deadlocked the pipeline for 18 hours; "I want no deadlock"), so N pushes
      # are N independent runs finishing in build order — and an OLDER commit's
      # rollout can land after a newer one's (measured twice 2026-09-11: run
      # #3729, the parent, rolled out 6 s after #3731, its child, and the child's
      # work was gone from the live bundle with both runs green). So the guard
      # sits at the rollout, and the one question it answers is "is the live
      # build already past this commit?": it reads the sha production serves
      # (`/version`, no-store, the GIT_SHA this same job bakes into the image)
      # and compares ANCESTRY with its own commit. Newer than production → roll,
      # whatever else has landed on main; a descendant already serving → skip.
      #
      # NOT "is main's tip still my commit" — the first cut, with two holes that
      # each left production behind main for an hour (wiki + games-ui boards,
      # 2026-09-11/12): (1) in a push burst every run found a newer tip by the
      # time its ~5-minute build was done, skipped, and nothing had a tail — the
      # site sat 45 minutes behind main while the monsters loop pushed art every
      # 3-6 minutes; (2) the tip counted commits this workflow never runs for,
      # so the maintainer saving a wiki verdict (live/**, never a deploy trigger)
      # cancelled the rollout he was waiting for. Rejected alongside: a shared
      # queue-style concurrency group (the deadlock), and re-resolving HEAD to
      # deploy the newest image instead (that image may not be built yet; asking
      # production needs nothing to exist).
      #
      # FAILS OPEN, deliberately: any trouble reading production or the compare
      # (a cold start, an API hiccup, an unexpected body) rolls out — a guard
      # that can silently stop deploys is the very thing this file learned not
      # to build. A DISPATCH is never skipped either: it is the manual recovery
      # lever and must always be able to force a rollout.
      - name: Would this rollout move production backwards?
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          MINE: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "roll=yes" >> "$GITHUB_OUTPUT"
          url=$(gcloud run services describe "${{ vars.GCP_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "$GITHUB_EVENT_NAME is not a push — rolling out unconditionally"; exit 0
          fi
          # `.image`, NOT `.sha` — THE WHOLE GUARD DEPENDS ON THIS. The comment
          # above says `.sha` is "the GIT_SHA this same job bakes into the
          # image", and that stopped being true when the fast lane started
          # serving published client generations: `.sha` names the CLIENT, which
          # can come from a LATER commit than the image. This guard then reads a
          # lane publish as "a descendant is already live" and skips the
          # rollout — so every art push (container lane only) would be silently
          # dropped for as long as the lane was ahead. `.image` is the question
          # actually being asked. `// .sha` covers a revision deployed before
          # that field existed.
          served=$( { [ -n "$url" ] && curl -fsS --max-time 30 --retry 2 "$url/version"; } 2>/dev/null | jq -r '.image // .sha // empty' 2>/dev/null || true)
          # A 40-hex sha or nothing. Asserted by SHAPE, not by counting
          # wildcards in a glob — the first cut of this line had 41 `?` and so
          # fell open on every real sha, which is a guard that only looks like
          # one.
          if ! printf '%s' "$served" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "could not read what production serves (got '$served') — rolling out"; exit 0
          fi
          if [ "$served" = "$MINE" ]; then
            echo "roll=no" >> "$GITHUB_OUTPUT"
            echo "production already serves $MINE — nothing to roll"
            echo "Production already serves \`$MINE\` — nothing rolled out." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # `compare/MINE...served` describes what production serves RELATIVE
          # TO this commit: "ahead" = a descendant is live and this run is
          # stale; "behind" = this commit is the newer one; "diverged" (a
          # force-push, an unrelated history) and any failure to answer are not
          # a supersede and still deploy.
          st=$(gh api "repos/${{ github.repository }}/compare/$MINE...$served" --jq '.status' 2>/dev/null || true)
          if [ "$st" = "ahead" ]; then
            echo "roll=no" >> "$GITHUB_OUTPUT"
            echo "NOT ROLLING OUT: production serves $served, a descendant of $MINE — the site is already past this commit."
            echo "**Not rolled out** — production already serves \`$served\`, which is ahead of this run's \`$MINE\`. The site is past this commit, not behind it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "production serves $served ('${st:-unknown}' relative to $MINE) — rolling out $MINE"
          fi

      - name: Deploy to Cloud Run
        if: steps.fresh.outputs.roll != 'no'
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}
          MINE: ${{ needs.resolve.outputs.sha }}
          URL: ${{ steps.fresh.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          deploy() {
            gcloud run deploy "${{ vars.GCP_SERVICE }}" \
              --image "$IMAGE:$MINE" \
              --region "${{ vars.GCP_REGION }}" \
              --platform managed \
              --allow-unauthenticated \
              --port 8080 \
              `# TWO vCPU (maintainer 2026-09-22, once the registry bill was` \
              `# brought down). NODE IS SINGLE-THREADED, so the second core does` \
              `# NOT make the 20 Hz world loop faster - it takes the work that` \
              `# already contends with it off the loop's core: the GC, and` \
              `# libuv's threadpool, which is where brotli and the asset reads` \
              `# for 50,121 art files run. That is what the loopLag MAX spikes` \
              `# are made of (mean 1.9 ms, max 535 ms measured with zero` \
              `# players), and it is the only part of them a core can absorb.` \
              `# 2 GiB (maintainer 2026-09-22, same breath as the second core).` \
              `# MEMORY WAS THE TIGHTER RESOURCE: measured 19.2% of one core` \
              `# against 643 MB of 1024 MB, so CPU had five times the headroom` \
              `# memory had. An OOM kills the world outright where CPU` \
              `# saturation only slows it, and it is the cheap side of the` \
              `# bill - a GiB-second costs a NINTH of a vCPU-second, so this` \
              `# whole line is about a fifth the price of the core beside it.` \
              `# It also raises what V8 will use: nothing sets` \
              `# --max-old-space-size, so Node sizes its old space from the` \
              `# CGROUP LIMIT, and doubling the container doubles that too.` \
              --cpu 2 --memory 2Gi \
              --min-instances 0 \
              `# THE FAST LANE, ON. The running server reads published client` \
              `# generations from this branch (games2/server/src/bundlestore.ts)` \
              `# and serves them instead of the image's client/dist, so a client` \
              `# push needs no image and no rollout (.github/workflows/`  \
              `# fast-publish.yml). The image bundle stays the permanent floor:` \
              `# nothing published, nothing readable, or anything the store's` \
              `# laws refuse, and this is inert. Unset it and the server is` \
              `# byte-identical to before (verify-fastlane arm A).` \
              `# --update-env-vars, NEVER --set-env-vars: the set form REPLACES` \
              `# the service's whole environment, so it would silently drop any` \
              `# variable configured outside this workflow (a REDIS_URL, the` \
              `# wiki token). The update form merges one key and touches nothing` \
              `# else.` \
              --update-env-vars "BUNDLE_STORE=github:${{ github.repository }}@bundle-store/bundle" \
              --max-instances 1 \
              --no-cpu-throttling \
              --no-session-affinity \
              --timeout 3600
          }
          deploy
          echo "Rolled out \`$MINE\`." >> "$GITHUB_STEP_SUMMARY"
          # TWO ROLLOUTS IN FLIGHT AT ONCE can still cross — the guard above ran
          # before either, so the older one can finish last. Read production
          # once more: if it now serves an ANCESTOR of this commit, an older
          # rollout landed over this one, and this commit rolls once more. The
          # newer commit always has the last word; nothing ever re-rolls over a
          # descendant, and a run re-rolls at most once.
          [ "${{ github.event_name }}" = "push" ] || exit 0
          # `.image`, NOT `.sha`. Since the fast lane exists, /version's `sha`
          # names the CLIENT being served, which may be a published generation
          # from a commit this image does not contain — so comparing it against
          # this rollout would make the guard re-roll over a lane publish. The
          # guard is about which IMAGE is serving, and that is `.image`. The
          # `// .sha` fallback covers a revision deployed before that field
          # existed.
          served=$( { [ -n "$URL" ] && curl -fsS --max-time 30 --retry 2 "$URL/version"; } 2>/dev/null | jq -r '.image // .sha // empty' 2>/dev/null || true)
          printf '%s' "$served" | grep -Eq '^[0-9a-f]{40}$' || exit 0
          [ "$served" != "$MINE" ] || exit 0
          st=$(gh api "repos/${{ github.repository }}/compare/$MINE...$served" --jq '.status' 2>/dev/null || true)
          if [ "$st" = "behind" ]; then
            echo "production serves $served, an ancestor of $MINE — an older rollout landed over this one; rolling $MINE once more"
            deploy
            echo "An older rollout had landed over it (\`$served\`); rolled out \`$MINE\` once more." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show URL
        if: steps.fresh.outputs.roll != 'no'
        run: |
          gcloud run services describe "${{ vars.GCP_SERVICE }}" \
            --region "${{ vars.GCP_REGION }}" --format='value(status.url)'

      # ...AND NOW THE LAYER CACHE FOR THE NEXT DEPLOY (see the build step).
      # `type=cacheonly` writes no image: the builder still holds every layer
      # from the build above, so this resolves from its local cache and spends
      # its time only on the export. It runs whatever the rollout did, and it
      # can never fail the deploy — a missed export costs the next build its
      # warm layers, which is a slow build, not a wrong one.
      - name: Write the layer cache for the next deploy
        if: always()
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: games2/Dockerfile
          push: false
          outputs: type=cacheonly
          provenance: false
          build-args: |
            GIT_SHA=${{ needs.resolve.outputs.sha }}
            GIT_COMMIT_TS=${{ needs.resolve.outputs.ts }}
          cache-from: |
            type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}-buildcache:main
            type=gha
          # mode=max keeps the intermediate stages (curate's per-domain COPYs are
          # the whole point); image-manifest+oci-mediatypes is what Artifact
          # Registry needs to accept a cache manifest as an image.
          cache-to: |
            type=registry,ref=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/${{ vars.GCP_SERVICE }}-buildcache:main,mode=max,image-manifest=true,oci-mediatypes=true
            type=gha,mode=max
