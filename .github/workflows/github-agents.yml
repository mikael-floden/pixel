name: github agents

# EVERY AGENT HAS A GITHUB AGENT (maintainer 2026-09-18: "every agent I have
# also have a github agent. This is how I think about it"). A review he commits
# starts that domain's github agent — a fresh session, shaped by that domain's
# own docs, bound by live/docs/review-contract.md. Not a "wake", not a "verdict
# session": "I feel this is insanely confusing".
#
# WHO STARTS IT: THE WIKI SERVER, inside the same save that writes the verdict
# (games2/server/src/live.ts `startGithubAgent`). It already holds a GitHub
# token and has just committed the delta, so it POSTs a workflow_dispatch here
# naming the domain — nothing between his tap and the runner: no trigger to
# evaluate, no detect job, no API call of ours in front of the session. Without
# it a verdict sits until the domain agent's next run reads the file (PROTOCOL
# rule 4), which can be hours.
#
# WHY NOT A PUSH TRIGGER, which this was built on first: the action refuses that
# event — "Unsupported event type: push" — so the run was created, the right job
# started, and it died 30 seconds in. It cost two of his reviews. Overriding
# GITHUB_EVENT_NAME does not help: the action reads the event from the payload
# file. workflow_dispatch is an event it accepts, and every session that has
# ever worked here was one.
#
# TWO THINGS PAID FOR ON THE WAY, kept because they will be reached for again:
#   • A job `if` cannot test a changed PATH on this repo. The push payload
#     carries no file lists at all — `commits.*.modified` is `[]`,
#     `head_commit.modified` is null — so any such condition is false always. A
#     workflow-level `paths:` filter is unaffected, because GitHub evaluates
#     that server-side against the real diff.
#   • A skipped job is SILENT: no log, no reason, just a run that did nothing.
#     That is why a wrong condition survived two rehearsals — a dispatch has no
#     commits, so the term was never evaluated. Verify a trigger against a real
#     event, never by reading it.
# Both measured 2026-09-18; the numbers are in live/docs/github-agents.md.
#
# THE FILE IS NOT THE DIRECTORY: he reviews scenery and the wiki writes
# feedback/OBJECTS.json, whose domain on disk is scenery/; characters.json is
# characters2/. That mapping now lives in the server (AGENT_DOMAIN) and in the
# `verdicts` step of github-agent-run.yml, which names the file for the prompt.
#
# NOT WOKEN BY: bindings.json (an <event>#<sound> review, not a domain) and
# composer/composer-music (games2/composer is one corner of a directory six
# agents share — a stand-in there needs the games2 split decided first).
#
# THE SESSION IS A THIRD WRITER in its domain, after the agent and its
# assistant, so its prompt binds it to PROTOCOL's "Two writers per directory".
#
# REASONING, SETUP, MEASUREMENTS: live/docs/github-agents.md.
# KILL SWITCH WITHOUT SETUP: repo variable GITHUB_AGENTS = "off".

# The title in the Actions list is the first thing he reads on a phone, so it
# names the review rather than repeating the workflow's own name.
run-name: >-
  github agent — ${{ inputs.domain }}${{ inputs.dry_run && ' (rehearsal)' || '' }}

# NO PUSH TRIGGER. `anthropics/claude-code-action@v1` refuses that event —
# "Unsupported event type: push" — so a push-started run created the job and
# died 30s in, which cost two of his reviews. The wiki server dispatches this
# workflow itself in the same save that writes the verdict
# (games2/server/src/live.ts `startGithubAgent`): no trigger to evaluate, no
# detect job, and workflow_dispatch is the event the action accepts.
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Which DOMAIN to rehearse against (scenery, monsters, tiles…)"
        type: string
        default: "monsters"
      dry_run:
        description: "Report what it would do and change nothing"
        type: boolean
        default: false

# A CALLED WORKFLOW CANNOT GRANT ITSELF MORE THAN ITS CALLER HAS. The session
# needs `contents: write` to push and `id-token: write` to mint its GitHub App
# token; declaring them inside github-agent-run.yml is not enough, and the run
# dies at startup with no job ever created (measured: run 12, startup_failure,
# seconds after the dispatch). So the caller grants them here.
permissions:
  contents: write
  id-token: write

jobs:
  # ONE JOB, because the domain is an input now rather than something to work
  # out from a payload. The 8 per-domain jobs this replaces each carried an `if`
  # over the push event; with no push trigger they could only ever appear as
  # eight skipped rows under every run.
  agent:
    if: vars.GITHUB_AGENTS != 'off'
    uses: ./.github/workflows/github-agent-run.yml
    with:
      domain: ${{ inputs.domain }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
