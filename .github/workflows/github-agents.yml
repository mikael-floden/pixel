name: github agents

# EVERY AGENT HAS A GITHUB AGENT (maintainer 2026-09-18: "every agent I have
# also have a github agent. This is how I think about it"). A review he commits
# starts that domain's github agent — a fresh session, shaped by that domain's
# own docs, bound by live/docs/review-contract.md. Not a "wake", not a "verdict
# session": "I feel this is insanely confusing".
#
# THE EVENT ALREADY EXISTS: the wiki's admin save is committed to main by the
# game server itself — games2/server/src/live.ts `ghCommitDelta`, one commit per
# save, message `live: admin update — feedback/<file>.json`. Without this
# workflow a verdict sits until the domain agent's next run reads the file
# (PROTOCOL rule 4), which can be hours.
#
# NOTHING IN FRONT OF THE WORK (maintainer 2026-09-18: "So this is just an
# artificial sleep?!? Remove it completely!", then "we want them to be able to
# run in parallel! But we also need lower latency ... think hard and we can get
# the best of both worlds"). Both, like this:
#
#   • ONE JOB PER DOMAIN, each with a job-level `if` that reads the PUSH PAYLOAD
#     — no detect job, no runner, no API call and no clone in front of the
#     session. The domain whose feedback file was written starts at once; the
#     others are never created, so they cost nothing and do not clutter the run.
#     (The `detect` job this replaces cost ~5s of every start just to learn what
#     the payload already said.)
#   • They are independent jobs, so a scenery review and a monsters review run
#     SIDE BY SIDE, each in its own concurrency group inside the reusable
#     workflow.
#   • Everything about HOW a session runs lives once, in github-agent-run.yml.
#
# THE FILE IS NOT THE DIRECTORY: he reviews scenery and the wiki writes
# feedback/OBJECTS.json, whose domain on disk is scenery/; characters.json is
# characters2/. The mapping is the `if` of each job, where it reads at a glance.
#
# THE PAYLOAD HERE CARRIES NO FILE LISTS — TEST THE MESSAGE. Measured by
# github-agents-selftest.yml on a one-commit, one-file push (2026-09-18 20:02Z):
# `commits` is present with the commit's author, id and message, and NO
# `added`/`modified`/`removed` on it at all; `head_commit.modified` is `null` and
# `commits.*.modified` resolves to `[]`. Any `if` over a changed PATH is
# therefore false always, whatever the push contained — and it cost a real review
# (c15246bbc6, 19:48:54Z, one commit modifying exactly live/feedback/objects.json:
# the workflow's own `paths:` filter matched, the run was created, and every job
# in it skipped). The `paths:` filter above works because GitHub evaluates it
# server-side against the real diff; a job `if` only gets the payload.
#
# What IS in the payload is every commit's MESSAGE, and the wiki server writes
# `live: admin update — feedback/<file>.json`, naming the file it saved. So each
# job tests that message: on `head_commit` first, and over every commit in the
# push as the second chance for a save that is not the head commit. Both are
# proven against real payloads by the selftest (`message_form`, `messages_form`).
#
# A SKIPPED JOB IS SILENT — it writes no log and no reason, which is why this
# survived two rehearsals: a `workflow_dispatch` has no commits, so the term was
# never evaluated. Verify a trigger change against a real push, never by reading.
#
# NOT WOKEN BY: bindings.json (an <event>#<sound> review, not a domain) and
# composer/composer-music (games2/composer is one corner of a directory six
# agents share — a stand-in there needs the games2 split decided first).
#
# THE SESSION IS A THIRD WRITER in its domain, after the agent and its
# assistant, so its prompt binds it to PROTOCOL's "Two writers per directory".
#
# REASONING, SETUP, MEASUREMENTS: live/docs/github-agents.md.
# KILL SWITCH WITHOUT SETUP: repo variable GITHUB_AGENTS = "off".

# The title in the Actions list is the first thing he reads on a phone, so it
# names the review rather than repeating the workflow's own name.
run-name: >-
  github agent — ${{ github.event_name == 'workflow_dispatch'
    && format('{0} (rehearsal)', inputs.domain) || github.event.head_commit.message }}

on:
  push:
    branches: [main]
    paths:
      - "live/feedback/*.json"
  workflow_dispatch:
    inputs:
      domain:
        description: "Which DOMAIN to rehearse against (scenery, monsters, tiles…)"
        type: string
        default: "monsters"
      dry_run:
        description: "Report what it would do and change nothing"
        type: boolean
        default: true

# A CALLED WORKFLOW CANNOT GRANT ITSELF MORE THAN ITS CALLER HAS. The session
# needs `contents: write` to push and `id-token: write` to mint its GitHub App
# token; declaring them inside github-agent-run.yml is not enough, and the run
# dies at startup with no job ever created (measured: run 12, startup_failure,
# seconds after the dispatch). So the caller grants them here.
permissions:
  contents: write
  id-token: write

jobs:
  # HIS SAVES ONLY. The wiki server stamps every admin save with this message;
  # an agent clearing verdicts writes the same file with its own message, and
  # waking on that would wake the agent with its own footprints.
  monsters:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/monsters.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/monsters.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: monsters }
    secrets: inherit

  scenery:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/objects.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/objects.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: scenery }
    secrets: inherit

  characters2:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/characters.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/characters.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: characters2 }
    secrets: inherit

  tiles:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/tiles.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/tiles.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: tiles }
    secrets: inherit

  items:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/items.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/items.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: items }
    secrets: inherit

  lore:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/lore.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/lore.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: lore }
    secrets: inherit

  sounds:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/sounds.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/sounds.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: sounds }
    secrets: inherit

  music:
    if: >-
      github.event_name == 'push' && vars.GITHUB_AGENTS != 'off'
      && ((startsWith(github.event.head_commit.message, 'live: admin update')
           && contains(github.event.head_commit.message, 'feedback/music.json'))
          || (contains(toJSON(github.event.commits.*.message), 'live: admin update')
              && contains(toJSON(github.event.commits.*.message), 'feedback/music.json')))
    uses: ./.github/workflows/github-agent-run.yml
    with: { domain: music }
    secrets: inherit

  # The rehearsal path: any domain, dry by default, so the whole chain can be
  # proven without a verdict and without touching anything.
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/github-agent-run.yml
    with:
      domain: ${{ inputs.domain }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
