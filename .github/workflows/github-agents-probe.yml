name: github agents — push probe

# ONE QUESTION: can the action run on a PUSH if it is handed a workflow_dispatch
# EVENT PAYLOAD? It refuses `push` outright ("Unsupported event type: push") and
# overriding GITHUB_EVENT_NAME alone did nothing, because it reads the event
# from the file at GITHUB_EVENT_PATH. So this writes a synthetic dispatch
# payload and points the action at it. If it works, the push trigger comes back
# and the wiki server does not have to start anything.
#
# Fires only on pushes under live/docs/**, never in front of a review. Delete it
# once the answer is recorded in live/docs/github-agents.md.
on:
  push:
    branches: [main]
    paths: ["live/docs/**"]

jobs:
  synthetic_dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - id: evt
        run: |
          set -u
          OUT="$RUNNER_TEMP/dispatch-event.json"
          python3 - > "$OUT" <<'PY'
          import json, os
          real = json.load(open(os.environ["GITHUB_EVENT_PATH"]))
          print(json.dumps({
              "inputs": {"domain": "scenery", "dry_run": "true"},
              "ref": "refs/heads/main",
              "workflow": ".github/workflows/github-agents-probe.yml",
              "repository": real.get("repository"),
              "sender": real.get("sender"),
          }))
          PY
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        continue-on-error: true
        env:
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_EVENT_PATH: ${{ steps.evt.outputs.path }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model claude-opus-5 --max-turns 1"
          prompt: "Reply with the two characters OK and nothing else."
