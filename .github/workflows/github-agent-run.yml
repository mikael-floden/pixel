name: github agent

# ONE GITHUB AGENT, FOR ONE DOMAIN. Called by github-agents.yml, which decides
# WHICH domains a push touched; everything about HOW a session runs lives here,
# in one copy, however many domains call it.
#
# It is a reusable workflow rather than a matrix because the caller has to be
# able to start a domain's job WITHOUT a job in front of it computing the list
# (maintainer 2026-09-18: parallel domains AND the lowest possible latency —
# "think hard and we can get the best of both worlds"). A matrix needs that
# list; a job-level `if` over the push payload does not.

on:
  workflow_call:
    inputs:
      domain:
        required: true
        type: string
      dry_run:
        required: false
        default: false
        type: boolean

jobs:
  agent:
    # The job's name is what the Actions run lists, so it reads as the agent he
    # is thinking of rather than as a workflow step.
    name: ${{ inputs.domain }}-github-agent
    runs-on: ubuntu-latest
    timeout-minutes: 90     # a generation pass; the loop stops itself on budget
    permissions:
      contents: write       # it pushes the work and its board claim to main
      # THE ACTION MINTS ITS GITHUB APP TOKEN FROM AN OIDC TOKEN, and a job
      # cannot request one without this. Measured on the first rehearsal: three
      # retries of "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL" and the run
      # died before Claude ever started — it reads as an auth failure, and is
      # not one.
      id-token: write
    # QUEUE, NEVER CANCEL. A run here may be
    # halfway through a generation, and killing it loses art already paid for;
    # a later sitting waits its turn. Per DOMAIN, so a scenery review never
    # queues behind a monsters generation.
    concurrency:
      group: github-agent-${{ inputs.domain }}
      cancel-in-progress: false
    steps:
      # CLAUDE STARTS AS SOON AS POSSIBLE (maintainer 2026-09-18: "We need to
      # make this faster! I want claude to start working immediately if
      # possible!"). Measured on the rehearsal before this line: 2m51s of the
      # run was `actions/checkout` pulling the WHOLE history of a repo whose
      # weight is binary art.
      #
      # `filter: blob:none` is a partial clone: the full commit graph arrives,
      # and a file's contents are fetched only when something actually opens it
      # — which for an agent is its own domain, not eleven domains' history.
      # `fetch-depth: 50` keeps enough history for the rebase before its push
      # (main moves a handful of commits an hour, and the merge base is always
      # within them). NOT depth 1: a rebase cannot find the merge base there and
      # fails in a way that reads like a conflict.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          filter: blob:none
          # A SPARSE WORKING TREE: its own domain, the files every agent reads,
          # and the shared scripts a pipeline calls — not eleven domains of art
          # (measured: the full tree cost 171s before Claude read a line). Cone
          # mode always includes the repo root, so CLAUDE.md and
          # requirements.txt come with it. The agent can widen it itself
          # (`git sparse-checkout add <dir>`), which the prompt says.
          sparse-checkout: |
            ${{ inputs.domain }}
            coordination
            live

      # THE CLI COMES FROM CACHE — 8s of every start, which is a lot when the
      # whole start is 20 (maintainer 2026-09-18: "fix the optimazation! Don't
      # revert it! 8s is a lot!").
      #
      # IT IS TRUSTED ONLY AFTER IT RUNS. The first cut trusted `cache-hit` and
      # handed the action a path that held nothing: "Claude Code native binary
      # not found ... errorClass: executable_not_found", 5 seconds into a real
      # scenery review. A cache hit says a key was found, not that the file is
      # there and works — so the step below EXECUTES it (`claude --version`) and
      # only then names the path. Anything less than that, and the action
      # installs its own as it always did.
      - id: cli
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/claude
          key: claude-cli-v2
      - id: cliok
        continue-on-error: true
        run: |
          set -u
          BIN="$HOME/.local/bin/claude"
          if [ -x "$BIN" ] && timeout 20 "$BIN" --version >/dev/null 2>&1; then
            echo "path=$BIN" >> "$GITHUB_OUTPUT"
            echo "cached CLI verified: $("$BIN" --version 2>/dev/null | head -1)"
          else
            # A stale or half-saved entry is worse than none: drop it so this
            # run's post-step saves a good one.
            rm -f "$BIN" || true
            echo "no usable cached CLI — the action will install it"
          fi

      # NO PYTHON SET-UP ON THE CRITICAL PATH (maintainer 2026-09-18: "Can we get
      # the 27s down to 20s?"). setup-python + `pip install -r requirements.txt`
      # cost 6s of every start, before Claude read a line — and a session that
      # only clears a verdict or answers "nothing to do" never needs them. The
      # runner already ships python3, and the prompt tells the agent to install
      # the requirements itself the moment it actually reaches for a pipeline.

      # HAND IT THE DIFF — DO NOT MAKE IT FIND ONE (measured 2026-09-18: of a
      # 5m58s scenery run, 4m29s passed before the first claim, and the bulk of
      # it was working out WHAT he had changed — reading a 5190-entry
      # objects.json and comparing it against the art. The push payload already
      # knows: `before` and `after` are two shas, and the changed keys are a
      # `git show` of each side plus a dict compare. It costs under a second
      # here and saves minutes there.)
      #
      # THIS IS ALSO WHERE THE FILE NAME IS RESOLVED. He reviews scenery and the
      # wiki writes feedback/OBJECTS.json; characters2 is characters.json. The
      # prompt used to name `live/feedback/<domain>.json`, which for scenery is
      # a path that does not exist — the first real session had to work that out
      # for itself and said so on its board.
      #
      # IT NEVER FAILS THE RUN: no before-image (a dispatch, a force-push, a
      # first commit) just means the agent reads the file itself, as it did
      # before this step existed.
      - id: verdicts
        continue-on-error: true
        env:
          DOMAIN: ${{ inputs.domain }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          {
            echo "changed<<VERDICTS_EOF"
            python3 - <<'PY'
          import json, os, subprocess, sys
          FILES = {"scenery": "objects", "characters2": "characters"}
          name = FILES.get(os.environ["DOMAIN"], os.environ["DOMAIN"])
          path = "live/feedback/%s.json" % name
          def entries(rev):
              try:
                  blob = subprocess.run(["git", "show", "%s:%s" % (rev, path)],
                                        capture_output=True, text=True, check=True).stdout
                  return json.loads(blob).get("entries", {})
              except Exception:
                  return None
          now = entries("HEAD")
          before = os.environ.get("BEFORE", "")
          if not before or set(before) == {"0"}:
              # STARTED BY THE WIKI SERVER: there is no `before` sha on a
              # dispatch, but the save that dispatched this IS the commit at
              # HEAD — so its parent is the before-image. Only when HEAD really
              # is one of his saves; anything else and the agent reads the file.
              head_msg = subprocess.run(["git", "log", "-1", "--format=%s"],
                                        capture_output=True, text=True).stdout.strip()
              before = "HEAD~1" if head_msg.startswith("live: admin update") else ""
          old = entries(before) if before else None
          print("THE FILE IS %s" % path)
          if now is None:
              print("(this run could not read it — read it yourself)"); sys.exit(0)
          if old is None:
              print("(no before-image for this run — diff it yourself: it holds %d entries)" % len(now)); sys.exit(0)
          moved = [k for k, v in now.items() if old.get(k) != v]
          gone = [k for k in old if k not in now]
          if not moved and not gone:
              print("(no entry moved in this push — say so on your board and stop)"); sys.exit(0)
          for k in sorted(moved)[:40]:
              v = now[k] or {}
              bits = [str(v.get("status", "?"))]
              if v.get("rating") is not None: bits.append("rating %s" % v["rating"])
              if v.get("note"): bits.append("note: %s" % v["note"])
              was = (old.get(k) or {}).get("status")
              print("  %s -> %s%s" % (k, ", ".join(bits), "   (was %s)" % was if was else "   (new)"))
          for k in sorted(gone)[:40]:
              print("  %s -> the entry itself is GONE from the file" % k)
          rest = max(0, len(moved) - 40) + max(0, len(gone) - 40)
          if rest: print("  (…and %d more — read the file)" % rest)
          PY
            echo "VERDICTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        env:
          # The generating domains need their key exactly as the scheduled art
          # workflows do; without it a session can read verdicts but not act on
          # the ones that need new art.
          PIXELLAB_API_KEY: ${{ secrets.PIXELLAB_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # NO FORCED THINKING BUDGET (maintainer 2026-09-18: "Opus 5 can be fast
          # if you tell Opus 5 to hurry up ... some instruction to try and
          # fulfill the request as fast as possible and not spend time if not
          # needed is the best approch"). A floor under the thinking makes the
          # one-deletion case as slow as the hard one; the PACE rule at the top
          # of the prompt does the opposite and lets the model spend where it
          # actually has to. MAX_THINKING_TOKENS was set here for one commit and
          # taken out again on his call.
        with:
          # Whichever of the two auth secrets this repo holds; the empty one is
          # ignored, so the app's OAuth token and a plain API key both work.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # ALWAYS THE STRONGEST MODEL (maintainer 2026-09-18: "Can we make sure
          # to always run Opus 5", "What Claude AI is running Opus 5 on MAX is
          # desired!"). Pinned explicitly so a change of default never quietly
          # downgrades what acts on his reviews — the run log prints the model it
          # initialised with, which is how to check it rather than assume.
          # THE TOOLS IT NEEDS TO ACT. Found the hard way (2026-09-18): a session
          # ran twice on a live rejected scenery state, verified the verdict
          # against the art by hand and then reported "this runner denies python
          # execution and all file writes" — pip, every scenery/pipeline command,
          # board.py, even the Write of its own board. It could READ but not DO,
          # and from the outside that looks exactly like an agent that decided
          # not to bother.
          #
          # A domain's work IS its python pipeline, its board IS a file, and its
          # push IS git — so Bash, the edit tools and acceptEdits are the job,
          # not a convenience. The blast radius is one ephemeral runner with a
          # sparse checkout and a token that can only push to this repo.
          claude_args: >-
            --model claude-opus-5 --max-turns 150
            --permission-mode acceptEdits
            --allowedTools Bash,Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite
          # Empty unless the cached binary ANSWERED --version in this job.
          path_to_claude_code_executable: ${{ steps.cliok.outputs.path }}
          # WHAT DID IT DO? The run's Step Summary is the one page he can read
          # on a phone from the Actions tab, so the report goes there. The
          # input's warning is about Claude-authored text in a public summary;
          # the input here is his own verdicts and this repo, and the summary is
          # private to the repo.
          display_report: "true"
          # TEMPORARY: the scenery session ran 8 minutes, reported success and
          # changed nothing, with one rejected state waiting in the file. The
          # SDK hides its own output, so the only way to learn what it decided
          # is to let it print. Removed once that is known.
          show_full_output: "true"
          prompt: |
            A wiki review just landed on main. You are standing in for the
            ${{ inputs.domain }} agent for this one unit of work, in a fresh checkout with
            no memory of earlier runs.

            WHAT HE JUST CHANGED — ALREADY DIFFED FOR YOU. This is the entries that moved
            in this push, and the name of the file they live in. You do not have to find
            them; the file holds thousands of entries and only these are new:

            ${{ steps.verdicts.outputs.changed }}

            Trust that for WHAT MOVED and for nothing else. Whether the art on disk still
            matches the verdict, what the verdict MEANS in this domain, and whether
            someone already claimed it are all yours to establish — from the file, the
            disk and the boards.

            PACE — HIS STANDING RULE, AND IT APPLIES TO YOU (maintainer: "Don't over
            think my tasks. If a task is easy and takes 5sec then do the task in 5sec",
            and of this session: "Opus 5 can be fast if you tell Opus 5 to hurry up").
            He is waiting on the other side of this. So:
              • Do the smallest correct thing that satisfies the verdict, and stop. One
                unit of work, not a pass over the domain.
              • Read for the RULE you need, not the whole document. The five files below
                are where the rules are, not a syllabus.
              • Do not explore the repo, refactor, tidy, improve docs, or fix anything
                nobody asked about — even if you can see it. Post it on your board and
                leave it.
              • Do not re-derive what a pipeline command already knows: run the domain's
                own command rather than reasoning your way to the same result by hand.
              • Deliberate in proportion to what is at stake. Deleting art, spending
                PixelLab credit or touching a partner's file deserves thought; clearing
                a verdict and pushing does not.
              • PUSH THE MOMENT THE UNIT IS DONE AND THE CHECKS PASS (maintainer
                2026-09-18: "fulfill the request as fast as possible and push to main as
                fast as possible and not spend time that is not needed. We are running
                fast in this project"). Do not hold finished work back to bundle it with
                more, and do not re-verify what the domain's own checks already verified.
                Pushed work is work he can see; unpushed work dies with this runner.
              • The only thing you may take real time over is work that genuinely takes
                it — a generation the verdict asks for, a pipeline that runs for minutes.
                Everything around it is overhead: keep it to seconds.

            TAKE THE SHAPE OF THAT AGENT. Read these before deciding anything — ALL FOUR
            IN ONE MESSAGE, they do not depend on each other and reading them one after
            another is three round-trips he waits through. (CLAUDE.md, the law of the
            repo, is already in your context — the CLI loads it every turn. Do not open
            it again.)
              1. coordination/PROTOCOL.md — "Two writers per directory" binds you.
              2. live/docs/review-contract.md — HOW A REVIEW IS ACTED ON AND CLEANED UP.
                 This is the part you must not improvise. Its short form: a verdict
                 describes ONE generation of the art, so the entry dies as part of doing
                 the work; an approval is never cleared; a removal removes the art, the
                 index entry, the upstream record AND every verdict keyed on it, entity
                 and facet alike; and when you are done, no key in the file may name a
                 path, state or direction that is not on disk.
              3. ${{ inputs.domain }}/README.md — the authority on the art: what approved,
                 redo and removed MEAN here and which pipeline command does each.
              4. live/README.md — the feedback file's schema and per-domain vocabulary.

            Then:
            1. Read coordination/${{ inputs.domain }}.json and
               coordination/${{ inputs.domain }}-assistant.json (whichever exist) — in the
               SAME message as the four above; they are small and they are on disk. A
               verdict either board has claimed or acked is CONSUMED — leave it. If
               either board's `current` names a file you would touch, that unit is not
               yours; a collision goes to the original agent.
            2. Take only the verdicts nobody has claimed and that the art on disk does
               not yet reflect. Derive that from the filesystem, never from a count.
            3. Claim them on coordination/${{ inputs.domain }}-github-agent.json — your own
               board, same schema as the others: the unit and EVERY file you will touch
               — and push that claim BEFORE any work. A claim that ships with the work
               protects nothing. THAT EXACT FILENAME, ALWAYS: one board for every
               stand-in this domain will ever have, overwritten by each. Never a board
               per run, per session or per date — a new file each time would bury the
               fleet under thousands of dead rows within a year, and the Agents page in
               the wiki is read by a human.
            Your working tree is SPARSE — your domain, coordination/ and live/, plus the
            repo root. games2/scripts (to-webp.py and friends) and wiki/lib are NOT there
            until you ask for them. If you need another directory, widen it
            yourself with `git sparse-checkout add <dir>` rather than working around a
            missing path.

            The runner has python3 but NOT this repo's packages: run
            `pip install -r requirements.txt` yourself before the first pipeline command
            that needs them (it takes about 5 seconds). It is not done for you because
            most of these sessions never run a pipeline at all, and every start pays for
            it.

            4. Do the work with the domain's OWN pipeline commands rather than by hand
               where it has them, clear each verdict as you act on it, run the domain's
               checks, `git fetch && git rebase origin/main`, re-run the checks if main
               moved under your domain, push to main, then release the claim saying what
               shipped and which entries you cleared.
            5. LEAVE AN ACCOUNT, AND PUSH IT. A RUN THAT LEAVES NO ACCOUNT DID NOT
               HAPPEN. Before you finish, write on your board and push it:
                 • what you TOOK — the verdicts you claimed, by key;
                 • what you DID — the commands you ran, what shipped, the sha;
                 • what you did NOT do and WHY — a verdict left to the domain agent, a
                   take you would not regenerate, a budget you stopped against;
                 • what you CLEARED — every feedback entry you removed, by key.
               Set `health` to "idle" (or "error", with what broke) and `updated_at` to
               now — never "running": your runner is destroyed when this job ends, and a
               board left claiming to run describes a session that no longer exists.

            THIS BINDS A RUN THAT CHANGED NOTHING JUST AS HARD. "Nothing to do" is a
            DECISION, and it is the one most worth reading: say what you read, what you
            concluded and from which file, and PUSH that. Never end a session with an
            unpushed board. It happened on 2026-09-18 — a session ran eight minutes on a
            live rejected state, reported success, wrote nothing and pushed nothing, and
            nobody can now tell whether it was right. A board push costs one commit to
            coordination/ and triggers no deploy; a silent run costs the only record of
            your reasoning.

            Budget: if the generation credits are low, stop cleanly and say so on your
            board rather than half-generating.

            DRY RUN: ${{ inputs.dry_run }} — when that reads true, do the reading and
            steps 1 and 2 only, then write what you WOULD do (each verdict, the files it
            would touch, the entries it would clear) into your REPORT and stop. Change
            nothing, claim nothing, generate nothing, commit nothing — a dry run is the
            one case where the account stays in the report instead of the board. It is
            the smoke test for this workflow, not a pass over the queue.
