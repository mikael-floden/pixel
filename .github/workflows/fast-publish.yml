# THE FAST LANE: ship CLIENT code without building a container or rolling out a
# new Cloud Run revision. Push -> the running server serves the new bundle.
#
# The container path stays exactly as it is for everything else, and this
# workflow deliberately does NOT cover it:
#   - ART never gets a lane. Art touches the ?v=<GIT_SHA> -> immutable grant in
#     games2/server/src/cachepolicy.ts; changing art bytes while GIT_SHA is
#     fixed would freeze two different byte-sets under one URL for a year, and
#     that is the unrecallable, project-deleting bug. Art rides the image.
#   - SERVER / shared / config code cannot travel this way either: adopting it
#     means re-importing modules in the process that owns the authoritative
#     20 Hz world, i.e. a restart, i.e. a revision.
#
# WHY A BRANCH AND NOT A BUCKET. The server already reads live/** straight from
# GitHub with no redeploy (games2/server/src/live.ts, measured 5-9 s
# push-to-visible), so the channel is proven in production and needs no bucket,
# no IAM and no Cloud Shell step from a phone-only maintainer. The generations
# live on their OWN branch so main's history stays clean and the blobs never
# enter the image's build context.
#
# ORDER IS THE SAFETY ARGUMENT (see games2/scripts/publish-bundle.mjs): every
# blob lands under its content hash, then the manifest, then the pointer, and
# only then the poke. A run interrupted anywhere leaves production untouched.
name: fast-publish

on:
  push:
    branches: [main]
    paths:
      # ONLY THE MODULE GRAPH. Deliberately NOT games2/client/** — that would
      # include client/public/**, and a published generation carries index.html
      # plus assets/ and NOTHING ELSE. Measured: the dist root also holds 12
      # entries and 4.6 MB the generation does not carry (monsters.json 885 KB,
      # npcs.json 765 KB, ui2/ 1.04 MB, icons/ 698 KB, logo*.webp,
      # characters.json, chess/, shipset.json, worlds.json, sw.js,
      # manifest.webmanifest). Those fall through to the IMAGE, so publishing a
      # public/** change would run new code against the image's OLD catalogs —
      # a mixed generation, which is the one thing this whole design exists to
      # make impossible. public/** is art-derived and belongs on the container
      # lane.
      - "games2/client/src/**"
      - "games2/client/index.html"

# Never two publishers at once: the pointer's seq is read-modify-write, so a
# race could skip a generation. Not cancel-in-progress — a half-finished
# publish should finish writing its blobs (they are content-addressed and
# harmless) rather than be killed between them.
concurrency:
  group: fast-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the generation to its own branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # HEAD~1 must exist: the lane check diffs against it

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games2/package-lock.json

      - name: Install (client deps only — the bundler and nothing else)
        working-directory: games2
        run: npm ci

      # A PUSH THAT NEEDS A NEW SERVER MUST NOT PUBLISH ITS CLIENT FIRST. The
      # path filter cannot see this: one push can touch client/src AND
      # server/src, and then the fast lane would hand players a client in
      # seconds that needs a server arriving five minutes later. The container
      # lane carries such a push whole, as it does today.
      - name: Lane check — client-only, or nothing
        id: lane
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~1..HEAD"
          else
            git fetch --depth=1 origin "$BEFORE" 2>/dev/null || true
            RANGE="$BEFORE..HEAD"
          fi
          CHANGED=$(git diff --name-only "$RANGE" 2>/dev/null || git diff --name-only HEAD~1..HEAD)
          echo "$CHANGED" | sed 's/^/  /'
          OUTSIDE=$(echo "$CHANGED" | grep -vE '^games2/client/(src/|index\.html)' | grep -vE '^(coordination/|live/)' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NOT publishing: this push also changes files the fast lane cannot carry:"
            echo "$OUTSIDE" | sed 's/^/  /'
            { echo "**Not published to the fast lane** — this push also changes:"; echo '```'; echo "$OUTSIDE"; echo '```'; echo "The container lane carries it whole."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # THE GATE RUNS BEFORE THE PUBLISH, NOT AFTER. A three-second deploy of a
      # bundle that does not start is a three-second outage, and he tests in
      # production from a phone. verify-fastbundle boots a real browser against
      # a real server and asserts BOOTS / JOINS / RENDERS / CLEAN.
      # THE BROWSER THE GATE NEEDS. playwright-core ships none, and a runner has
      # nothing at PLAYWRIGHT_BROWSERS_PATH — the gate hardcoded the dev
      # container's own chromium path, so in CI it could only ever have failed
      # and this lane could never have published anything. Cached because the
      # download is ~30 s and this lane's whole purpose is being fast; the
      # install step short-circuits on a cache hit. Same shape as wiki-guard.yml.
      - name: Cache the browser
        if: steps.lane.outputs.publish == 'true'
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.61.1-${{ runner.os }}
      - name: Install chromium if it was not cached
        if: steps.lane.outputs.publish == 'true' && steps.pwcache.outputs.cache-hit != 'true'
        run: npx --yes playwright@1.61.1 install --with-deps chromium

      - name: Gate — the bundle boots, joins and renders
        if: steps.lane.outputs.publish == 'true'
        working-directory: games2
        run: node scripts/verify-fastbundle.mjs

      # A TRANSIENT FETCH FAILURE MUST NOT LOOK LIKE "NO STORE YET". The first
      # cut was `fetch || branch-from-empty-tree || true`, which on a network
      # blip hands the publisher an EMPTY store: it then sees no pointer, starts
      # seq at 1, and every running instance refuses that generation and every
      # later one (LAW 2) until the seq climbs back past where it was. So ask
      # the remote whether the branch exists, and treat the two cases apart.
      #
      # The worktree lives under RUNNER_TEMP, not `../store`: a step's
      # `working-directory` resolves inside GITHUB_WORKSPACE, so a sibling of
      # the checkout is not addressable from one and the commit step below
      # failed on a directory that does not exist.
      - name: Fetch the store branch
        if: steps.lane.outputs.publish == 'true'
        env:
          STORE: ${{ runner.temp }}/store
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin bundle-store >/dev/null 2>&1; then
            echo "the store branch exists — fetching it"
            git fetch --depth=1 origin bundle-store:bundle-store
          elif git ls-remote --heads origin >/dev/null 2>&1; then
            echo "the store branch does not exist yet — creating it from an empty tree"
            git branch bundle-store "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m 'bundle store')"
          else
            echo "::error::cannot reach the remote to tell whether bundle-store exists; refusing to publish against an unknown store"
            exit 1
          fi
          git worktree add "$STORE" bundle-store
          echo "store worktree at $STORE"

      - name: Publish the generation
        id: pub
        if: steps.lane.outputs.publish == 'true'
        working-directory: games2
        env:
          GIT_SHA: ${{ github.sha }}
          STORE: ${{ runner.temp }}/store
        run: |
          # THE COMMIT'S OWN TIMESTAMP orders this publish against the IMAGE
          # (games2/server/src/bundlestore.ts). Without it the server cannot
          # tell whether this client is newer than the one in the container, so
          # a publish from an earlier commit could override a later rollout.
          # %ct is the committer date and needs no history beyond HEAD.
          # `pipefail`, because the publish is PIPED: without it the status is
          # tee's and a publish that THROWS is reported as a successful one,
          # after which the poke waits for a generation that was never written.
          set -euo pipefail
          TS=$(git show -s --format=%ct HEAD)
          echo "publishing the client of $GIT_SHA, committed $TS"
          node scripts/publish-bundle.mjs --store "$STORE/bundle" --sha "$GIT_SHA" --commit-ts "$TS" | tee /tmp/pub.log
          if grep -q "already current" /tmp/pub.log; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            # The generation id, so the poke below can wait for THIS generation
            # rather than for "something is being served" — which is true of the
            # PREVIOUS generation too and made a failed flip report success.
            GEN=$(sed -n 's/^\[publish\] \([0-9a-f]\{16\}\) seq .*/\1/p' /tmp/pub.log | head -1)
            echo "gen=$GEN" >> "$GITHUB_OUTPUT"
            echo "published generation $GEN"
          fi

      - name: Commit and push it
        if: steps.pub.outputs.changed == 'true'
        working-directory: ${{ runner.temp }}/store
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add bundle
          # NOTHING TO COMMIT IS A DEFECT HERE, not a no-op: the publisher just
          # reported that it wrote blobs, a manifest and a pointer. `|| exit 0`
          # hid that and left the poke waiting for a generation nobody pushed.
          if git diff --cached --quiet; then
            echo "::error::the publisher reported a new generation but the store worktree has no changes"
            exit 1
          fi
          git commit -q -m "bundle: ${{ github.sha }}"
          for i in 1 2 3 4; do
            git push origin bundle-store && exit 0
            echo "push failed, retrying in $((2 ** i))s"; sleep $((2 ** i))
            # A concurrent publisher is the only expected cause. Rebase onto it
            # and try again; the blobs are content-addressed so they merge, and
            # the pointer is the one file that can conflict.
            git fetch origin bundle-store && git rebase origin/bundle-store || true
          done
          echo "::error::could not push the generation after 4 attempts"
          exit 1

      # THE POKE, exactly like live-notify.yml: the server re-reads the pointer
      # and flips. Unauthenticated because it only asks for a re-read of public
      # data it already reads, and a spurious call is a no-op.
      - name: Poke the game server
        if: steps.pub.outputs.changed == 'true'
        env:
          GEN: ${{ steps.pub.outputs.gen }}
        run: |
          # RETRIES ARE EXPECTED, NOT A FAILURE MODE. The blobs are read from
          # raw.githubusercontent, and a path pushed seconds ago can briefly
          # 404 while it replicates; the server then keeps serving the old
          # generation (it never flips to one it could not fully read) and the
          # next poke picks it up. The 60 s belt in the server is the floor
          # under this loop, so a lost poke costs a minute, never a deploy.
          OK=""
          for i in 1 2 3 4 5 6 7 8; do
            OUT=$(curl -fsS -X POST --max-time 25 https://nangijala.online/api/bundle/refresh || true)
            echo "attempt $i: $OUT"
            if [ -n "$GEN" ] && echo "$OUT" | grep -q "\"serving\":\"$GEN\""; then OK="yes"; break; fi
            sleep 4
          done
          if [ -n "$OK" ]; then
            echo "### Live on the fast lane" >> "$GITHUB_STEP_SUMMARY"
            echo "Generation \`$GEN\` from \`${{ github.sha }}\` is being served — no image, no rollout." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the server has not adopted $GEN yet; its 60 s belt will pick it up"
            echo "Published \`$GEN\`, but the server had not adopted it within the poke window." >> "$GITHUB_STEP_SUMMARY"
            echo "Its 60 s refresh belt will adopt it; nothing is broken and the image is still the floor." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Nothing to publish
        if: steps.lane.outputs.publish == 'true' && steps.pub.outputs.changed != 'true'
        run: echo "The bundle is byte-identical to the current generation — nothing published." >> "$GITHUB_STEP_SUMMARY"
