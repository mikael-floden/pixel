<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nangijala — Items</title>
<style>
  :root { --bg:#12141a; --card:#1b1e27; --edge:#2b2f3d; --ink:#e8eaf0; --dim:#9aa0b0; --accent:#ffcf6b; --gold:#ffd36b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--edge); position:sticky; top:0; background:var(--bg); z-index:5; }
  h1 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--dim); font-size:13px; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { border:1px solid var(--edge); background:var(--card); color:var(--ink); padding:4px 10px; border-radius:999px; font-size:13px; cursor:pointer; }
  .chip.active { border-color:var(--accent); color:var(--accent); }
  main { padding:14px; display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:10px; cursor:pointer; }
  .thumb { width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
           background:linear-gradient(45deg,#0d0f14 25%,transparent 25%),linear-gradient(-45deg,#0d0f14 25%,transparent 25%),
           linear-gradient(45deg,transparent 75%,#0d0f14 75%),linear-gradient(-45deg,transparent 75%,#0d0f14 75%);
           background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; border-radius:8px; overflow:hidden; }
  .thumb img { width:96px; height:96px; object-fit:contain; image-rendering:pixelated; }
  .name { font-weight:600; margin-top:8px; }
  .sub { color:var(--dim); font-size:12px; }
  .gold { color:var(--gold); font-size:12px; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:1px; }
  dialog { border:1px solid var(--edge); background:var(--card); color:var(--ink); border-radius:14px; max-width:92vw; width:460px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog img { width:160px; height:160px; object-fit:contain; image-rendering:pixelated; background:#0d0f14; border-radius:10px; }
  .close { float:right; cursor:pointer; color:var(--dim); border:none; background:none; font-size:20px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px; margin-top:12px; font-size:13px; }
  .kv div:nth-child(odd) { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>💰 Nangijala — Items</h1>
  <div class="meta" id="meta">loading…</div>
  <div class="filters" id="filters"></div>
</header>
<main id="grid"></main>

<dialog id="detail"><button class="close" onclick="detail.close()">×</button><div id="body"></div></dialog>

<script>
let DATA = null, activeType = "all";
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const rarityColor = (r) => (DATA.rarities?.[r]?.color) || "#9aa0b0";

function open(it) {
  const b = document.getElementById("body");
  b.innerHTML = "";
  b.appendChild(el("div", null, `<img src="${esc(it.sprite.replace(/^items\//, ""))}" alt="">`));
  b.appendChild(el("div", "name", esc(it.name)));
  b.appendChild(el("div", "sub", esc(it.description)));
  const kv = el("div", "kv");
  const rows = [["type", it.type], ["category", it.category], ["rarity", it.rarity],
                ["sells for", it.value != null ? it.value + " gold" : "—"],
                ["stack", it.stackable ? "up to " + it.max_stack : "not stackable"],
                ["id", it.id], ["art", (it.size || []).join("×") + " px"]];
  if (it.soul?.power) rows.splice(4, 0, ["merge grants", it.soul.power]);
  for (const [k, v] of rows) { kv.appendChild(el("div", null, esc(k))); kv.appendChild(el("div", null, esc(v))); }
  b.appendChild(kv);
  document.getElementById("detail").showModal();
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const it of DATA.items) {
    if (activeType !== "all" && it.type !== activeType) continue;
    const c = el("div", "card");
    c.appendChild(el("div", "thumb", `<img src="${esc(it.sprite.replace(/^items\//, ""))}" alt="" loading="lazy">`));
    c.appendChild(el("div", "name", esc(it.name)));
    c.appendChild(el("div", "sub", `<span class="dot" style="background:${rarityColor(it.rarity)}"></span>${esc(it.category || it.type)}`));
    c.appendChild(el("div", "gold", it.value != null ? it.value + " gold" : ""));
    c.onclick = () => open(it);
    grid.appendChild(c);
  }
}

fetch("viewer_data.json").then((r) => r.json()).then((d) => {
  DATA = d;
  const counts = Object.entries(d.counts || {}).map(([k, v]) => `${v} ${k}`).join(" · ");
  document.getElementById("meta").textContent = `${d.items.length} items — ${counts}`;
  const f = document.getElementById("filters");
  for (const t of ["all", ...Object.keys(d.counts || {})]) {
    const chip = el("button", "chip" + (t === activeType ? " active" : ""), t.toLowerCase());
    chip.onclick = () => { activeType = t; [...f.children].forEach((c) => c.classList.remove("active")); chip.classList.add("active"); render(); };
    f.appendChild(chip);
  }
  render();
}).catch((e) => { document.getElementById("meta").textContent = "could not load viewer_data.json — " + e; });
</script>
</body>
</html>
