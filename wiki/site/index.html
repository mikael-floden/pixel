<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- FIRST PAINT, BEFORE ANY STYLESHEET CAN ARRIVE (maintainer 2026-08-15: "the
     Nangijala Wiki iframe flashes white for a short short time because the
     iframe bg is white and the page has not loaded yet"). wiki.css is an
     external, revalidating stylesheet, so on a slow open the browser paints
     its default canvas first — white — and the drawer flashes. These few
     lines are part of the document, so they cost nothing and cannot be late.
     The script runs before them to apply the CHOSEN theme: the meta above
     only follows the OS, and picking dark in a light-mode phone would flash
     white anyway. Colours are the two --bg values from wiki.css; if that
     palette ever changes, change them here too. -->
<script>try{var t=localStorage.getItem("wiki-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
  :root { background: #faf9f5; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { background: #262624; } }
  :root[data-theme="dark"] { background: #262624; color-scheme: dark; }
  :root[data-theme="light"] { background: #faf9f5; color-scheme: light; }
</style>
<title>Nangijala Wiki</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128214;</text></svg>">
<link rel="stylesheet" href="wiki.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-title">Nangijala</div>
      <div class="brand-sub">game wiki</div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button id="admin-btn" class="ghost-btn" title="Game Master sign in">Game Master</button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <button id="menu-btn" class="ghost-btn" aria-label="Menu">☰</button>
      <input id="search" type="search" placeholder="Search…" autocomplete="off">
      <div id="build-stamp" class="muted"></div>
    </header>
    <div id="content"><div class="loading" role="status" aria-live="polite">
      <div class="loading-brand">Nangijala</div>
      <div class="loading-bar"><span></span></div>
      <div class="loading-note">gathering the world…</div>
    </div></div>
  </main>
</div>
<div id="menu-scrim"></div>
<div id="savebar" class="hidden">
  <span id="savebar-text"></span>
  <button id="save-btn" class="primary-btn">Commit</button>
  <button id="discard-btn" class="ghost-btn">Cancel</button>
</div>
<dialog id="login-dialog">
  <form id="login-form" method="dialog">
    <h3>Game Master sign in</h3>
    <p class="muted">Signing in unlocks rating, approve/remove and live gameplay
    tuning. Saves are committed by the game server — no credentials live in
    this browser beyond your session.</p>
    <input id="login-user" type="text" placeholder="username" autocomplete="username">
    <input id="login-pass" type="password" placeholder="password" autocomplete="current-password">
    <p id="login-error" class="login-error"></p>
    <div class="dialog-row">
      <button id="login-submit" value="signin" class="primary-btn" type="submit">Sign in</button>
      <button value="cancel" class="ghost-btn" type="button" onclick="this.closest('dialog').close()">Close</button>
    </div>
  </form>
</dialog>
<audio id="shared-audio" preload="none"></audio>
<script src="wiki.js"></script>
</body>
</html>
